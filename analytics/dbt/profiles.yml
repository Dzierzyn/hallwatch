hallwatch:
  target: "{{ env_var('HW_TARGET', 'dev') }}"
  outputs:
    # dev: DuckDB reads Parquet from disk - the full pipeline with no cloud account
    dev:
      type: duckdb
      path: "{{ env_var('HW_DUCKDB', '../data/warehouse.duckdb') }}"
      threads: 4
      extensions: [parquet]
    # prod: BigQuery via gcloud ADC (no key files in the repo)
    prod:
      type: bigquery
      method: oauth
      project: "{{ env_var('HW_GCP_PROJECT', 'unset') }}"
      dataset: "{{ env_var('HW_BQ_DATASET', 'hallwatch') }}"
      location: "{{ env_var('HW_BQ_LOCATION', 'EU') }}"
      threads: 4
      priority: interactive
      job_retries: 2
