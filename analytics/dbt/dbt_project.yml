name: hallwatch
version: "0.1.0"
config-version: 2
profile: hallwatch

model-paths: ["models"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Parquet directory for the dev target (DuckDB reads the files directly)
  raw_dir: "../data/raw"
  # the time zone in which analytics interprets the 'hour of day'
  timezone: "Europe/Warsaw"

models:
  hallwatch:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
