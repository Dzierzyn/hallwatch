version: 2

models:
  - name: fct_events
    description: "Fact table at the grain of a single event."
    columns:
      - name: event_id
        tests: [unique, not_null]
      - name: camera
        tests: [not_null]

  - name: agg_hourly_traffic
    description: >
      Grain: hour x camera, in local time, with zeros filled in for hours
      without traffic. Input table for the forecasting model.
    columns:
      - name: hour_ts
        tests: [not_null]
      - name: events
        tests: [not_null, dbt_utils_non_negative]

  - name: agg_daily_summary
    columns:
      - name: traffic_date
        tests: [not_null]

  - name: mart_traffic_monitor
    description: "Facts + forecast + anomalies in one place, for the dashboard and alerts."
    columns:
      - name: hour_ts
        tests: [not_null]
