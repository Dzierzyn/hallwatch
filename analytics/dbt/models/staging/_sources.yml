version: 2

sources:
  - name: hallwatch_raw
    description: "Raw events extracted from the CV pipeline's SQLite, as Parquet."
    schema: "{{ env_var('HW_BQ_RAW_DATASET', 'hallwatch_raw') }}"
    meta:
      # dev/DuckDB reads the files directly; BigQuery ignores this and uses the dataset tables
      external_location: "{{ var('raw_dir') }}/{name}/**/*.parquet"
    tables:
      - name: events
        description: "One event = one episode of activity on a camera."
      - name: crossings
        description: "A single crossing of the counting line by a tracked object."
      - name: minute_stats
        description: "Per-minute aggregates written continuously by the pipeline."
