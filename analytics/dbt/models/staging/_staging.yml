version: 2

models:
  - name: stg_events
    description: "Events after cleaning: UTC and local time, camera pulled from JSON."
    columns:
      - name: event_id
        description: "Primary key of the event."
        tests: [unique, not_null]
      - name: camera
        # no accepted_values here: camera names are free-form and deployment-specific
        tests:
          - not_null
      - name: event_kind
        tests:
          - accepted_values:
              arguments:
                values: ["person", "vehicle", "motion", "audio"]
      - name: started_at
        tests: [not_null]
      - name: duration_s
        tests:
          - dbt_utils_non_negative  # custom test, see macros/tests.sql

  - name: stg_crossings
    columns:
      - name: crossing_id
        tests: [unique, not_null]
      - name: event_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_events')
                field: event_id
      - name: direction
        tests:
          - accepted_values:
              arguments:
                values: ["in", "out"]

  - name: stg_minute_stats
    description: "Per-minute aggregates; the grain is the (camera, minute) pair."
    columns:
      - name: minute_epoch
        tests: [not_null]
      - name: camera
        tests: [not_null]
