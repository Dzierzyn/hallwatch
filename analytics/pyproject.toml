[project]
name = "hallwatch-elt"
version = "0.1.0"
description = "ELT + ML nad zdarzeniami z pipeline'u computer vision HallWatch"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.1",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
    "google-cloud-bigquery>=3.25",
    "google-cloud-storage>=2.18",
    "db-dtypes>=1.3",
]

[project.optional-dependencies]
dbt = ["dbt-core>=1.9", "dbt-duckdb>=1.9", "dbt-bigquery>=1.9"]

[project.scripts]
hw-elt = "hallwatch_elt.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
