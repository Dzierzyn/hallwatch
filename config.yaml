# ---------------------------------------------------------------------------
# HallWatch configuration
#
# This default works OUT OF THE BOX with a laptop webcam: one camera, always
# on, counting people. Point `source` at an RTSP URL when you have a real
# camera. More elaborate setups (multiple cameras, battery cameras, vehicle
# counting) live in examples/ - copy what you need.
#
# Line, zone and mask coordinates are NORMALISED to 0..1, so they survive a
# change of resolution. Draw them by clicking:  hallwatch zones
# ---------------------------------------------------------------------------

cameras:
  - name: "camera"
    # What to watch. Accepts:
    #   "0"                          laptop / USB webcam (a number = device index)
    #   "rtsp://user:password@ip:554/stream1"   any RTSP camera
    #   "http://phone-ip:8080/video" an old phone running the IP Webcam app
    #   "path/to/video.mp4"          a file, great for testing
    source: "0"
    mode: "continuous" # continuous | on_demand (battery cams) | sampling (traffic stats)

    detection:
      classes: [0] # COCO ids: 0=person, 2=car, 3=motorcycle, 5=bus, 7=truck

    counting:
      # People crossing this line are counted with direction. Adjust to your
      # scene with `hallwatch zones`, or delete `line` to disable counting.
      line: [[0.08, 0.62], [0.92, 0.62]]
      direction_labels:
        positive: "in"
        negative: "out"
      # anchor: which point of the person decides a crossing.
      #   feet   - camera looks along a corridor / at an angle (default)
      #   center - camera looks straight down from the ceiling
      anchor: "feet"

    privacy:
      # Areas blurred BEFORE detection, recording and upload - nothing from a
      # masked region ever reaches disk. Draw masks with `hallwatch zones`.
      # masks:
      #   - name: "neighbours-window"
      #     polygon: [[0.62, 0.22], [0.99, 0.22], [0.99, 0.92], [0.62, 0.92]]
      #     mode: "blur" # blur | black | pixelate
      masks: []

# --- shared settings --------------------------------------------------------

defaults:
  width: 960 # processing width; lower = faster (Raspberry Pi: try 640)
  fps_limit: 15 # Raspberry Pi: try 5-8

  detection:
    model: "yolo11n.pt" # n = fastest; s/m = more accurate (auto-downloaded)
    device: "auto" # auto | mps | cuda | cpu
    conf: 0.40
    imgsz: 640 # Raspberry Pi: try 416 or 320

  recording:
    enabled: true
    dir: "data/clips"
    pre_roll_s: 4.0 # seconds captured BEFORE the event (ring buffer)
    post_roll_s: 6.0
    retention_days: 14 # `hallwatch prune` deletes older media

storage:
  db: "data/hallwatch.db"

cloud:
  # Optional off-site backup to any S3-compatible storage (Cloudflare R2,
  # Backblaze B2, MinIO, AWS). Keys come from env vars, never from this file:
  #   HALLWATCH_S3_KEY / HALLWATCH_S3_SECRET
  enabled: false
  endpoint_url: ""
  bucket: ""

notify:
  # Push notifications to your phone via ntfy.sh - no account needed.
  # Install the ntfy app, subscribe to a random topic, put it here.
  enabled: false
  ntfy_topic: ""

web:
  host: "127.0.0.1" # localhost only; see README before changing
  port: 8000
  # auth_token: "change-me" # strongly recommended when binding beyond localhost
  #                         # (startup warns, but nothing blocks access without it)
