# ---------------------------------------------------------------------------
# HallWatch - konfiguracja wielokamerowa
#
# `defaults` opisuje zachowanie wspolne, `cameras` liste kamer. Kazda kamera
# nadpisuje tylko to, czym naprawde sie rozni. Wspolrzedne linii, stref i masek
# sa ZNORMALIZOWANE do 0..1, wiec przezywaja zmiane rozdzielczosci.
# Wyznacz je klikaniem:  hallwatch zones --camera korytarz
# ---------------------------------------------------------------------------

defaults:
  width: 960
  fps_limit: 15
  reconnect_delay_s: 3.0
  mode: "continuous" # continuous | on_demand | sampling

  detection:
    model: "yolo11n.pt" # n=najszybszy, s/m=dokladniejsze
    device: "auto" # auto | mps | cuda | cpu
    conf: 0.40
    iou: 0.50
    imgsz: 640
    tracker: "bytetrack.yaml"
    awake_seconds: 8.0

  motion:
    enabled: true
    min_area_frac: 0.0015
    history: 400
    var_threshold: 24
    dilate_iter: 2
    warmup_frames: 30

  recording:
    enabled: true
    dir: "data/clips" # kazda kamera dostaje podkatalog ze swoim slugiem
    pre_roll_s: 4.0
    post_roll_s: 6.0
    max_clip_s: 120
    fps: 12
    crf: 26
    snapshot: true
    burn_overlay: false
    retention_days: 14

  audio:
    enabled: false # dziala tylko dla RTSP ze sciezka audio
    trigger_dbfs: -34.0
    release_dbfs: -40.0
    min_event_s: 0.4

cameras:
  # -------------------------------------------------------------------------
  - name: "korytarz"
    # Kamera na baterii przez Reolink Home Hub. Tryb on_demand nie trzyma
    # otwartego RTSP - laczy sie na sygnal i pozwala kamerze zasnac.
    #   curl -X POST 'http://127.0.0.1:8000/api/wake?camera=korytarz'
    source: "0" # docelowo: rtsp://user:haslo@IP-HUBA:554/...
    mode: "on_demand"
    session_seconds: 90
    session_idle_s: 20
    watch_hold_s: 25
    watch_max_s: 600
    # active_hours: "06:00-23:00"   # odkomentuj, by oszczedzic bateria nocą

    detection:
      classes: [0] # 0 = person (COCO)

    counting:
      # feet - kamera patrzy skosem w dol korytarza (tak trzeba przy PIR)
      # center - gdyby patrzyla prosto w dol z sufitu
      anchor: "feet"
      line: [[0.08, 0.62], [0.92, 0.62]]
      direction_labels:
        positive: "wejscie"
        negative: "wyjscie"
      zones:
        - name: "strefa-wejscia"
          polygon: [[0.05, 0.30], [0.48, 0.30], [0.48, 0.97], [0.05, 0.97]]

    privacy:
      # Puste = nic nie jest zaslaniane. Kadr obejmuje wlasne drzwi, wiec maski
      # nie sa potrzebne. Gdyby kadru nie dalo sie ograniczyc:
      #   - name: "obszar-obcy"
      #     polygon: [[0.62, 0.22], [0.99, 0.22], [0.99, 0.92], [0.62, 0.92]]
      #     mode: "blur"
      masks: []

  # -------------------------------------------------------------------------
  - name: "ulica"
    # Kamera balkonowa liczaca pojazdy. Statystyki ruchu nie moga opierac sie
    # na PIR - przegapilby wiekszosc aut i liczby nie znaczylyby nic. Zamiast
    # tego probkujemy: 5 minut co godzine, czyli widzimy 8,3% czasu, a kazde
    # zdarzenie niesie mnoznik do ekstrapolacji.
    source: "0" # docelowo: rtsp://user:haslo@IP-HUBA:554/...
    mode: "sampling"
    sampling:
      every_minutes: 60
      seconds: 300
      align_to_clock: true # okna o rownej godzinie => probki porownywalne miedzy dobami

    detection:
      # 2=car 3=motorcycle 5=bus 7=truck
      classes: [2, 3, 5, 7]
      # widok z gory/skosu na ulice jest trudniejszy niz ujecia z COCO
      conf: 0.30

    motion:
      # ulica rusza sie caly czas - bramka ruchu nic tu nie oszczedza,
      # a moglaby zgubic auto wjezdzajace w kadr powoli
      enabled: false

    counting:
      anchor: "center" # pojazdy z gory to plamy, srodek jest stabilniejszy
      line: [[0.05, 0.55], [0.95, 0.55]]
      direction_labels:
        positive: "w-prawo"
        negative: "w-lewo"
      zones: []

    recording:
      # Liczymy pojazdy, nie archiwizujemy ulicy. Statystyki ida do bazy,
      # wideo nie zostaje - mniej danych do obrony i mniejsza karta.
      enabled: false

    privacy:
      masks: []

storage:
  db: "data/hallwatch.db"

cloud:
  enabled: false
  endpoint_url: "" # np. https://<account>.r2.cloudflarestorage.com
  bucket: ""
  prefix: "hallwatch"
  region: "auto"
  delete_local_after_upload: false
  # klucze z env: HALLWATCH_S3_KEY / HALLWATCH_S3_SECRET

notify:
  enabled: false
  ntfy_server: "https://ntfy.sh"
  ntfy_topic: ""
  min_interval_s: 60
  attach_snapshot: true

web:
  host: "127.0.0.1"
  port: 8000
  stream_fps: 10
  stream_quality: 70
