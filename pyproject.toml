[project]
name = "hallwatch"
version = "0.1.0"
description = "Prywatny system CV do monitoringu korytarza: detekcja ruchu, liczenie osob, detekcja dzwieku, nagrywanie zdarzen"
requires-python = ">=3.10,<3.14"
dependencies = [
    "opencv-python>=4.10",
    "ultralytics>=8.3",
    "lap>=0.5.12", # solver przypisan wymagany przez ByteTrack
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "numpy<2.3",
    "boto3>=1.35",
    "requests>=2.32",
    "jinja2>=3.1",
]

[project.scripts]
hallwatch = "hallwatch.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
